name: Daily Institutional Intel Ingest

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run institutional intel ingestion
        run: |
          python scripts/ingest.py

      - name: Validate output integrity
        run: |
          python -c "
          import json, sys
          with open('data/signals.json', 'r', encoding='utf-8') as f:
              signals = json.load(f)
              assert isinstance(signals, list) and len(signals) > 0, 'data/signals.json must contain a non-empty list'
          with open('data/meta.json', 'r', encoding='utf-8') as f:
              meta = json.load(f)
              assert isinstance(meta, dict) and 'last_updated' in meta and 'total_signals' in meta, 'data/meta.json must be a valid metadata dict'
          print(f'Ingest integrity verified: {len(signals)} signals, last updated {meta.get(\"last_updated\")}')
          "

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/signals.json data/meta.json
            git commit -m "chore(intel): automated daily signals sync $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No data changes detected. Working tree clean."
          fi
